<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Meu acesso · Ayla</title><link rel="stylesheet" href="/buyer-account.css"><link rel="stylesheet" href="/fonts.css">
<link rel="preload" as="font" type="font/woff2" href="/fonts/poppins-400-7d93459d8658.woff2" crossorigin>
  <link rel="icon" href="/favicon.ico" sizes="any">
</head>
<body><main class="account-shell"><nav><a href="/">Voltar ao perfil</a></nav><section class="account-card"><p id="eyebrow" class="eyebrow"></p><h1 id="title">Meu acesso</h1><p id="intro">Carregando seu acesso…</p><p id="message" role="status" aria-live="polite"></p><form id="accountForm" hidden>
<label id="emailLabel">E-mail<input name="email" type="email" autocomplete="email" maxlength="254" required></label>
<label id="phoneLabel" hidden>Celular com DDD<input name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="20"></label>
<label id="passwordLabel">Senha<input name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required></label>
<label id="confirmLabel" hidden>Confirmar senha<input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128"></label>
<button id="submit" type="submit">Entrar</button></form><div id="orders" class="orders"></div><div id="links" class="account-links"></div></section><p class="footnote"></p></main><script src="/pending-checkouts.js"></script><script src="/buyer-account.js"></script></body></html>
